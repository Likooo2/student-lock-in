<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Lock-In</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lock-In">
<meta name="theme-color" content="#FAF6EF">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<style>
  :root{
    --paper:#FAF6EF;
    --paper-line:#E4DCC9;
    --ink:#22303A;
    --ink-soft:#5B6B72;
    --navy:#2C4A52;
    --amber:#C88A3B;
    --sage:#7C9A85;
    --card-edge:#EAE2CF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:64px;
  }
  .fond-texture{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:repeating-linear-gradient(180deg, transparent, transparent 27px, var(--paper-line) 28px);
    opacity:.35;
  }
  main{
    position:relative; z-index:1;
    max-width:480px; margin:0 auto;
    padding:32px 20px 20px;
  }
  header{
    margin-bottom:28px;
  }
  .eyebrow-jour{
    font-size:14px; color:var(--ink-soft); font-weight:500;
    text-transform:capitalize;
    margin-bottom:2px;
  }
  h1.date-principale{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:34px;
    line-height:1.08;
    margin:0;
    letter-spacing:-.01em;
  }
  section{
    margin-top:30px;
    padding-top:20px;
    border-top:1px solid var(--card-edge);
  }
  section h2{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:19px;
    margin:0 0 14px;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .badge-compte{
    font-family:'Inter',sans-serif;
    font-size:13px;
    color:var(--ink-soft);
    font-weight:500;
  }

  /* Cours */
  .ligne-cours{
    display:flex; gap:14px; padding:10px 0;
    border-bottom:1px solid var(--card-edge);
  }
  .ligne-cours:last-child{border-bottom:none;}
  .heure-cours{
    font-variant-numeric:tabular-nums;
    font-weight:600; font-size:14px;
    color:var(--navy);
    min-width:44px; flex-shrink:0; padding-top:1px;
  }
  .detail-cours .titre-cours{font-size:15px; font-weight:500; line-height:1.35;}
  .detail-cours .lieu-cours{font-size:13px; color:var(--ink-soft); margin-top:2px;}

  /* Devoirs */
  .ligne-devoir{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:12px; padding:11px 0;
    border-bottom:1px solid var(--card-edge);
  }
  .ligne-devoir:last-child{border-bottom:none;}
  .devoir-texte .devoir-titre{font-size:15px; font-weight:500;}
  .devoir-texte .devoir-matiere{font-size:13px; color:var(--ink-soft); margin-top:1px;}
  .devoir-deadline{
    font-size:13px; font-weight:600; white-space:nowrap;
    color:var(--ink-soft); text-align:right; padding-top:1px;
  }
  .devoir-deadline.urgent{color:var(--amber);}

  /* Sommeil / sport : lignes clé-valeur */
  .stat-ligne{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:9px 0;
    font-size:15px;
  }
  .stat-ligne .cle{color:var(--ink-soft);}
  .stat-ligne .val{font-weight:600; text-align:right;}
  .stat-detail{
    font-size:13px; color:var(--ink-soft); margin-top:2px; line-height:1.5;
  }
  .statut-ok{color:var(--sage);}
  .statut-attention{color:var(--amber);}
  .variation-hausse{color:var(--sage);}
  .variation-baisse{color:#B4573F;}

  .vide{
    font-size:14px; color:var(--ink-soft); font-style:italic; padding:6px 0;
  }
  .chargement, .erreur{
    font-size:14px; color:var(--ink-soft); padding:6px 0;
  }
  .erreur{color:var(--amber);}

  footer{
    max-width:480px; margin:36px auto 0; padding:0 20px;
    font-size:12px; color:var(--ink-soft);
    display:flex; justify-content:space-between; align-items:center;
  }
  .bouton-rafraichir{
    background:none; border:1px solid var(--card-edge); border-radius:100px;
    padding:6px 14px; font-size:12px; color:var(--ink-soft);
    font-family:'Inter',sans-serif; cursor:pointer;
  }
  .bouton-rafraichir:active{background:var(--card-edge);}
</style>
</head>
<body>
<div class="fond-texture"></div>
<main>
  <header>
    <div class="eyebrow-jour" id="eyebrow-jour">chargement…</div>
    <h1 class="date-principale" id="date-principale">Aujourd'hui</h1>
  </header>

  <section>
    <h2>Planning</h2>
    <div id="zone-cours" class="chargement">Chargement…</div>
  </section>

  <section>
    <h2>À faire</h2>
    <div id="zone-devoirs" class="chargement">Chargement…</div>
  </section>

  <section>
    <h2>Sommeil</h2>
    <div id="zone-sommeil" class="chargement">Chargement…</div>
  </section>

  <section>
    <h2>Sport</h2>
    <div id="zone-sport" class="chargement">Chargement…</div>
  </section>

  <section id="section-notifs">
    <h2>Notifications</h2>
    <div id="zone-notifs" class="chargement">Vérification…</div>
    <button class="bouton-rafraichir" id="bouton-activer-notifs" style="margin-top:10px; display:none;">Activer les notifications</button>
  </section>

  <section>
    <h2>Marchés</h2>
    <div id="zone-marches" class="chargement">Chargement…</div>
  </section>

  <footer>
    <span id="derniere-maj">—</span>
    <button class="bouton-rafraichir" onclick="chargerDonnees()">Actualiser</button>
  </footer>
</main>

<script>
const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbxC5ZWKukuJOlz97QjLWfV1KyQp2W03b0cwKQ4W9KUXuYsyTp67mCtVmfM9OJKhrHoD/exec";

const NOMS_JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const NOMS_MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

function afficherDate(){
  const maintenant = new Date();
  document.getElementById("eyebrow-jour").textContent = NOMS_JOURS[maintenant.getDay()];
  document.getElementById("date-principale").textContent = maintenant.getDate() + " " + NOMS_MOIS[maintenant.getMonth()];
}

function estUrgent(deadlineStr){
  // deadlineStr au format dd/MM/yyyy
  const [j, m, a] = deadlineStr.split("/").map(Number);
  const deadline = new Date(a, m - 1, j);
  const dansJours = (deadline - new Date()) / (1000 * 60 * 60 * 24);
  return dansJours <= 3;
}

function rendreCours(cours){
  const zone = document.getElementById("zone-cours");
  if (!cours || cours.length === 0){
    zone.innerHTML = '<div class="vide">Aucun cours aujourd\'hui.</div>';
    return;
  }
  zone.innerHTML = cours.map(c => `
    <div class="ligne-cours">
      <div class="heure-cours">${c.debut}</div>
      <div class="detail-cours">
        <div class="titre-cours">${c.titre}</div>
        ${c.lieu ? `<div class="lieu-cours">${c.lieu}</div>` : ''}
      </div>
    </div>
  `).join("");
}

function rendreDevoirs(devoirs){
  const zone = document.getElementById("zone-devoirs");
  if (!devoirs || devoirs.length === 0){
    zone.innerHTML = '<div class="vide">Rien en attente. Bien joué.</div>';
    return;
  }
  zone.innerHTML = devoirs.map(d => {
    const urgent = estUrgent(d.deadline);
    return `
    <div class="ligne-devoir">
      <div class="devoir-texte">
        <div class="devoir-titre">${d.titre}</div>
        <div class="devoir-matiere">${d.matiere}</div>
      </div>
      <div class="devoir-deadline ${urgent ? 'urgent' : ''}">${d.deadline}</div>
    </div>
  `;
  }).join("");
}

function rendreSommeil(dashboard){
  const zone = document.getElementById("zone-sommeil");
  const coucher = dashboard.coucher_recommande;
  const reveil = dashboard.reveil_recommande;
  const detail = dashboard.info_sommeil_detail;

  if (!coucher){
    zone.innerHTML = '<div class="vide">Pas encore de donnée pour ce soir.</div>';
    return;
  }
  zone.innerHTML = `
    <div class="stat-ligne"><span class="cle">Coucher recommandé</span><span class="val">${coucher}</span></div>
    ${reveil ? `<div class="stat-ligne"><span class="cle">Réveil</span><span class="val">${reveil}</span></div>` : ''}
    ${detail ? `<div class="stat-detail">${detail}</div>` : ''}
  `;
}

function rendreSport(dashboard){
  const zone = document.getElementById("zone-sport");
  const duJour = dashboard.sport_du_jour;
  const statut = dashboard.sport_statut;

  if (!duJour){
    zone.innerHTML = '<div class="vide">Pas encore de donnée pour aujourd\'hui.</div>';
    return;
  }
  const classeStatut = statut && statut.indexOf("⚠") === 0 ? "statut-attention" : "statut-ok";
  zone.innerHTML = `
    <div class="stat-ligne"><span class="cle">${duJour}</span>${statut ? `<span class="val ${classeStatut}">${statut}</span>` : ''}</div>
  `;
}

function formaterVariation(pourcentage){
  const signe = pourcentage >= 0 ? "+" : "";
  const classe = pourcentage >= 0 ? "variation-hausse" : "variation-baisse";
  return `<span class="${classe}">${signe}${pourcentage.toFixed(2)}%</span>`;
}

async function chargerMarches(data){
  const zone = document.getElementById("zone-marches");
  let ligneBitcoin = "";
  let ligneDcam = "";

  try {
    const reponseBtc = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=eur&include_24hr_change=true");
    const dataBtc = await reponseBtc.json();
    const prixBtc = dataBtc.bitcoin.eur;
    const variationBtc = dataBtc.bitcoin.eur_24h_change;
    ligneBitcoin = `
      <div class="stat-ligne">
        <span class="cle">Bitcoin</span>
        <span class="val">${prixBtc.toLocaleString('fr-FR', {maximumFractionDigits:0})} € ${formaterVariation(variationBtc)}</span>
      </div>`;
  } catch (e) {
    ligneBitcoin = '<div class="stat-ligne"><span class="cle">Bitcoin</span><span class="val erreur">indisponible</span></div>';
  }

  if (data && data.dcam) {
    ligneDcam = `
      <div class="stat-ligne">
        <span class="cle">DCAM (Amundi PEA Monde)</span>
        <span class="val">${data.dcam.prix.toFixed(2)} € ${formaterVariation(data.dcam.variation)}</span>
      </div>`;
  } else {
    ligneDcam = '<div class="stat-ligne"><span class="cle">DCAM (Amundi PEA Monde)</span><span class="val erreur">indisponible</span></div>';
  }

  zone.innerHTML = ligneBitcoin + ligneDcam;
}

async function chargerDonnees(){
  try {
    const reponse = await fetch(URL_WEB_APP);
    if (!reponse.ok) throw new Error("Réponse serveur invalide");
    const data = await reponse.json();

    rendreCours(data.coursDuJour);
    rendreDevoirs(data.devoirs);
    rendreSommeil(data.dashboard || {});
    rendreSport(data.dashboard || {});
    chargerMarches(data);

    const maintenant = new Date();
    document.getElementById("derniere-maj").textContent =
      "Mis à jour à " + maintenant.getHours().toString().padStart(2,"0") + ":" + maintenant.getMinutes().toString().padStart(2,"0");

  } catch (erreur) {
    ["zone-cours","zone-devoirs","zone-sommeil","zone-sport"].forEach(id => {
      document.getElementById(id).innerHTML = '<div class="erreur">Impossible de charger les données.</div>';
    });
    document.getElementById("derniere-maj").textContent = "Échec du chargement";
  }
}

afficherDate();
chargerDonnees();

// --- Notifications push (OneSignal) ---
const texteZoneNotifs = document.getElementById("zone-notifs");
const boutonActiverNotifs = document.getElementById("bouton-activer-notifs");

window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {
  try {
    await OneSignal.init({
      appId: "5fbe501c-8214-4770-a47a-567b251dfa27",
      allowLocalhostAsSecureOrigin: true,
    });

    const estInstalleSurEcranAccueil = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    if (!estInstalleSurEcranAccueil) {
      texteZoneNotifs.textContent = "Installe d'abord ce dashboard sur ton écran d'accueil (Partager → Sur l'écran d'accueil), puis reviens ici.";
      return;
    }

    const dejaAbonne = await OneSignal.User.PushSubscription.optedIn;
    if (dejaAbonne) {
      texteZoneNotifs.textContent = "Notifications activées ✅";
    } else {
      texteZoneNotifs.textContent = "Active les notifications pour être prévenu des changements importants.";
      boutonActiverNotifs.style.display = "inline-block";
      boutonActiverNotifs.addEventListener("click", async () => {
        await OneSignal.Notifications.requestPermission();
        texteZoneNotifs.textContent = "Notifications activées ✅";
        boutonActiverNotifs.style.display = "none";
      });
    }
  } catch (erreur) {
    texteZoneNotifs.textContent = "Erreur d'initialisation : " + erreur.message;
    texteZoneNotifs.className = "erreur";
  }
});

// Filet de sécurité : si le SDK OneSignal ne se charge pas du tout après 5 secondes
setTimeout(() => {
  if (texteZoneNotifs.textContent === "Vérification…") {
    texteZoneNotifs.textContent = "Le service de notifications n'a pas répondu (SDK non chargé).";
    texteZoneNotifs.className = "erreur";
  }
}, 5000);
</script>
</body>
</html>
